<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Container with squircle border radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative grid background glow -->
  <circle cx="256" cy="200" r="160" fill="#ffffff" fill-opacity="0.05" />

  <!-- Shield Badge Outline -->
  <path d="M256 70 L370 115 V240 C370 320 310 395 256 425 C202 395 142 320 142 240 V115 Z" 
        fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4" />

  <!-- Main Building Structure -->
  <g filter="url(#shadow)">
    <!-- Back Building -->
    <rect x="156" y="160" width="90" height="210" rx="8" fill="#1e293b" fill-opacity="0.7" />
    <!-- Back Building Windows -->
    <rect x="174" y="180" width="18" height="24" rx="3" fill="#60a5fa" opacity="0.8" />
    <rect x="208" y="180" width="18" height="24" rx="3" fill="#93c5fd" opacity="0.8" />
    <rect x="174" y="220" width="18" height="24" rx="3" fill="#93c5fd" opacity="0.8" />
    <rect x="208" y="220" width="18" height="24" rx="3" fill="#60a5fa" opacity="0.8" />
    <rect x="174" y="260" width="18" height="24" rx="3" fill="#60a5fa" opacity="0.8" />
    <rect x="208" y="260" width="18" height="24" rx="3" fill="#93c5fd" opacity="0.8" />

    <!-- Front Tower -->
    <rect x="230" y="110" width="130" height="260" rx="12" fill="#ffffff" />
    <!-- Tower Roof Accent -->
    <path d="M230 122 C230 115 235 110 242 110 L348 110 C355 110 360 115 360 122 V132 L230 132 Z" fill="#2563eb" />

    <!-- Front Tower Windows (Grid) -->
    <g fill="#2563eb" opacity="0.85">
      <rect x="252" y="150" width="24" height="30" rx="4" />
      <rect x="288" y="150" width="24" height="30" rx="4" />
      <rect x="324" y="150" width="24" height="30" rx="4" fill="#38bdf8" />
      
      <rect x="252" y="195" width="24" height="30" rx="4" fill="#38bdf8" />
      <rect x="288" y="195" width="24" height="30" rx="4" />
      <rect x="324" y="195" width="24" height="30" rx="4" />

      <rect x="252" y="240" width="24" height="30" rx="4" />
      <rect x="288" y="240" width="24" height="30" rx="4" fill="#38bdf8" />
      <rect x="324" y="240" width="24" height="30" rx="4" />

      <rect x="252" y="285" width="24" height="30" rx="4" fill="#38bdf8" />
      <rect x="288" y="285" width="24" height="30" rx="4" />
      <rect x="324" y="285" width="24" height="30" rx="4" />
    </g>

    <!-- Entrance Door -->
    <rect x="282" y="330" width="36" height="40" rx="4" fill="#0f172a" />
    <rect x="296" y="348" width="8" height="8" rx="4" fill="#fbbf24" />
  </g>

  <!-- Golden Key Overlay Emblem -->
  <g filter="url(#shadow)" transform="translate(110, 270)">
    <!-- Key Head Circle -->
    <circle cx="50" cy="50" r="34" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" />
    <circle cx="50" cy="50" r="16" fill="#1e3a8a" />
    <!-- Key Stem -->
    <rect x="78" y="42" width="100" height="16" rx="4" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
    <!-- Key Teeth -->
    <rect x="142" y="58" width="14" height="22" rx="3" fill="url(#goldGrad)" />
    <rect x="162" y="58" width="14" height="16" rx="3" fill="url(#goldGrad)" />
  </g>
</svg>
